# B-dsh-LocalAndOnline-model-connection — one install for local and online models.
#
# One row per capability: the local engine, the local-models card, and the
# Claude/ChatGPT sign-in card. This package owns the rows; its dependencies are
# the three plugins themselves.
#
# Use this instead of installing B-1001, B-1002, or B-1003 separately: a row id
# must be unique, and two sets of rows collide.
- insert:
    - id: b-1001-local-engine
      name: '@ml-hub476/b-1001-local-engine'
      config:
        modelPath: '~/.dsh/local-engine/models/qwen3-0.6b.gguf'
        contextSize: 8192
        displayName: 'Local (built-in)'
        port: 18111
    - id: b-1002-local-models
      name: '@ml-hub476/b-1002-local-models'
    - id: b-1003-ai-connection
      name: '@ml-hub476/b-1003-ai-connection'
